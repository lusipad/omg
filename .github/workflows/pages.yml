name: 发布 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: 缓存经过校验的 OpenModelica 和标准库下载
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/omc-downloads
          key: openmodelica-noble-amd64-${{ hashFiles('scripts/modelica/bootstrap-linux.sh') }}
      - name: 在镜像自带的构建工具上安装 OpenModelica
        run: bash scripts/modelica/bootstrap-linux.sh "$RUNNER_TEMP/omc" "$RUNNER_TEMP/omc-downloads"
      - name: 编译模型并对照原生和浏览器运行结果
        env:
          CLANG: clang-18
          WASM_LD: wasm-ld-18
        run: |
          source "$RUNNER_TEMP/omc/env.sh"
          python3 scripts/modelica/verify.py --omc omc --out "$RUNNER_TEMP/gouyuan-modelica-native"
          python3 -B scripts/modelica/verify-feed.py --omc omc --out "$RUNNER_TEMP/gouyuan-modelica-native"
          python3 -B scripts/modelica/verify-motor.py --omc omc --out "$RUNNER_TEMP/gouyuan-modelica-native"
          python3 scripts/modelica/build-web.py --check
          node scripts/modelica/compare-web.mjs "$RUNNER_TEMP/gouyuan-modelica-native"
          node scripts/modelica/compare-web.mjs "$RUNNER_TEMP/gouyuan-modelica-native" feed
          node scripts/modelica/compare-web.mjs "$RUNNER_TEMP/gouyuan-modelica-native" motor
      - name: 从零件装成电机并复算导出的数控进给轴
        run: |
          source "$RUNNER_TEMP/omc/env.sh"
          npx tsx scripts/modelica/prepare-motor-assemblies.ts "$RUNNER_TEMP/gouyuan-modelica-native"
          python3 -B scripts/modelica/verify-motor-exports.py --omc omc --out "$RUNNER_TEMP/gouyuan-modelica-native"
      - name: 在 Chromium 执行三轴圆槽加工并用原生 Modelica 复算
        run: |
          source "$RUNNER_TEMP/omc/env.sh"
          npx tsx scripts/modelica/prepare-contour-exports.ts "$RUNNER_TEMP/gouyuan-modelica-native"
          python3 -B scripts/modelica/verify-contour-exports.py --omc omc --out "$RUNNER_TEMP/gouyuan-modelica-native"
      - name: 复算机电控限位急停与信号极性反转闭环系统
        run: |
          source "$RUNNER_TEMP/omc/env.sh"
          npx tsx scripts/modelica/prepare-closed-loop-cases.ts "$RUNNER_TEMP/gouyuan-modelica-native"
          python3 -B scripts/modelica/verify-closed-loop.py --omc omc --out "$RUNNER_TEMP/gouyuan-modelica-native"
      - name: 复算整厂设备、批次和共享资源的调度
        env:
          CLANG: clang-18
          WASM_LD: wasm-ld-18
        run: |
          source "$RUNNER_TEMP/omc/env.sh"
          python3 -B scripts/modelica/build-factory-models.py --check
          python3 -B scripts/modelica/build-factory-scheduler.py --check
          node scripts/modelica/test-factory-scheduler.mjs --native
          npx tsx scripts/modelica/prepare-factory-cases.ts "$RUNNER_TEMP/gouyuan-modelica-native"
          python3 -B scripts/modelica/verify-factory-export.py --omc omc --out "$RUNNER_TEMP/gouyuan-modelica-native"
      - name: 保存原生回归日志与采样
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modelica-verification
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/gouyuan-modelica-native/**/*.log
            ${{ runner.temp }}/gouyuan-modelica-native/**/*.csv
            ${{ runner.temp }}/gouyuan-modelica-native/native-results.json
            ${{ runner.temp }}/gouyuan-modelica-native/web-comparison.json
            ${{ runner.temp }}/gouyuan-modelica-native/feed-native-results.json
            ${{ runner.temp }}/gouyuan-modelica-native/feed-web-comparison.json
            ${{ runner.temp }}/gouyuan-modelica-native/motor-native-results.json
            ${{ runner.temp }}/gouyuan-modelica-native/motor-web-comparison.json
            ${{ runner.temp }}/gouyuan-modelica-native/motor-assembly-comparison.json
            ${{ runner.temp }}/gouyuan-modelica-native/motor-assemblies/
            ${{ runner.temp }}/gouyuan-modelica-native/contour-export-comparison.json
            ${{ runner.temp }}/gouyuan-modelica-native/contour-exports/
            ${{ runner.temp }}/gouyuan-modelica-native/closed-loop-comparison.json
            ${{ runner.temp }}/gouyuan-modelica-native/closed-loop/
            ${{ runner.temp }}/gouyuan-modelica-native/factory-comparison.json
            ${{ runner.temp }}/gouyuan-modelica-native/factory-cases/
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 发布站点
        id: publish
        uses: actions/deploy-pages@v5
